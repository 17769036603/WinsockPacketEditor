<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>飘渺助手授权管理</title>
<style>
*{box-sizing:border-box}body{font:15px system-ui,sans-serif;margin:0;background:#f3f6f7;color:#17333b}main{max-width:1000px;margin:32px auto;padding:0 18px}h1{font-size:25px}section{background:white;border:1px solid #dae5e6;border-radius:12px;padding:18px;margin:14px 0}label{display:inline-grid;gap:6px;margin:6px 10px 6px 0}input,button{font:inherit;padding:9px 11px;border:1px solid #bacbce;border-radius:7px}button{cursor:pointer;background:#086c69;color:white;border:0}button.secondary{background:#e8f0f0;color:#184b4b}button.danger{background:#a33232}.status{color:#687b7f}.codes{white-space:pre-wrap;word-break:break-word;background:#f3f7f7;padding:12px;border-radius:8px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px 7px;border-bottom:1px solid #e5eded}td.actions{white-space:nowrap}td button{margin:2px;padding:6px 8px;font-size:13px}@media(max-width:720px){main{margin:14px auto}section{overflow:auto}table{min-width:850px}}
</style>
<main>
<h1>飘渺助手授权管理</h1>
<section><label>管理令牌（仅保存在本页内存）<input id="adminToken" type="password" autocomplete="off" size="42"></label><button id="connect">连接管理</button><span id="message" class="status" aria-live="polite"></span></section>
<section><h2>批量生成激活码</h2><label>有效天数<input id="durationDays" type="number" min="1" max="3650" value="30"></label><label>数量<input id="count" type="number" min="1" max="500" value="1"></label><button id="generate">生成</button><pre id="generated" class="codes"></pre><button id="copy" class="secondary">复制激活码</button></section>
<section><h2>授权列表（最多显示最近 1000 条）</h2><button id="refresh" class="secondary">刷新</button><label>按安装识别码筛选<input id="installFilter" type="search" placeholder="输入前缀"></label><table><thead><tr><th>授权编号</th><th>安装识别码</th><th>时长</th><th>首次激活</th><th>到期</th><th>绑定</th><th>状态</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></section>
</main>
<script>
const $=id=>document.getElementById(id), API='/admin/';let generated='',licenses=[];
const say=text=>{$('message').textContent=text};
async function call(path,body){const response=await fetch(API+path,{method:body===undefined?'GET':'POST',headers:{Authorization:'Bearer '+$('adminToken').value,...(body===undefined?{}:{'Content-Type':'application/json'})},body:body===undefined?undefined:JSON.stringify(body)});let data;try{data=await response.json()}catch{data={error:'响应无效'}}if(!response.ok)throw new Error(data.error||'请求失败');return data}
function date(value){return value?new Date(value).toLocaleString('zh-CN'):'未激活'}
function render(){const tbody=$('rows');tbody.replaceChildren();const query=$('installFilter').value.trim().toUpperCase();const visible=licenses.filter(item=>!query||item.installationHint.includes(query));for(const item of visible){const tr=document.createElement('tr');const values=[item.id.slice(0,12),item.installationHint||'—',item.durationDays+' 天',date(item.firstActivatedAt),item.expiresAt?date(item.expiresAt):'未激活',item.bound?'已绑定':'未绑定',item.revoked?'已停用':item.expiresAt&&item.expiresAt<=Date.now()?'已过期':'有效'];for(const value of values){const td=document.createElement('td');td.textContent=value;tr.append(td)}const actions=document.createElement('td');actions.className='actions';for(const [label,action,cls] of [['续期','extend','secondary'],['解绑','unbind','secondary'],['停用','revoke','danger']]){const button=document.createElement('button');button.textContent=label;button.className=cls;button.addEventListener('click',async()=>{try{let body={id:item.id};if(action==='extend'){const days=Number(prompt('增加有效天数',String(item.durationDays)));if(!Number.isInteger(days)||days<1)return;body.days=days}await call(action,body);say('操作完成');await refresh()}catch(e){say(e.message)}});actions.append(button)}tr.append(actions);tbody.append(tr)}say(`已加载 ${visible.length} / ${licenses.length} 条授权`)}
async function refresh(){try{licenses=(await call('list')).licenses;render()}catch(e){say(e.message)}}
$('connect').addEventListener('click',refresh);$('refresh').addEventListener('click',refresh);$('installFilter').addEventListener('input',render);$('generate').addEventListener('click',async()=>{try{const result=await call('generate',{durationDays:Number($('durationDays').value),count:Number($('count').value)});generated=result.codes.join('\n');$('generated').textContent=generated;say('生成 '+result.codes.length+' 个激活码；请立即复制保存')}catch(e){say(e.message)}});$('copy').addEventListener('click',async()=>{if(!generated)return say('当前没有待复制的激活码');try{await navigator.clipboard.writeText(generated);say('激活码已复制')}catch{say('剪贴板不可用，请手动复制')}});
</script>
