plugins {
    id 'com.android.application'
}

android {
    namespace 'com.xnas.wpe.battlepanel'
    compileSdk 35

    defaultConfig {
        applicationId 'com.xnas.wpe.battlepanel'
        minSdk 23
        targetSdk 35
        versionCode 3
        versionName '0.2.1'
        ndk {
            abiFilters 'x86_64'
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }

    sourceSets {
        main {
            jniLibs.srcDir(layout.buildDirectory.dir('generated/jniLibs'))
        }
    }
}

def buildRustReader = tasks.register('buildRustReader', Exec) {
    workingDir rootProject.projectDir
    commandLine 'powershell.exe', '-NoLogo', '-NoProfile', '-ExecutionPolicy', 'Bypass',
            '-File', new File(rootProject.projectDir, 'build-rust-reader.ps1').absolutePath
}

tasks.named('preBuild').configure {
    dependsOn buildRustReader
}


def buildResistanceQuery = tasks.register('buildResistanceQuery', Exec) {
    workingDir rootProject.projectDir
    commandLine 'powershell.exe', '-NoLogo', '-NoProfile', '-ExecutionPolicy', 'Bypass',
            '-File', new File(rootProject.projectDir, 'build-resistance-query.ps1').absolutePath
}
tasks.named('preBuild').configure { dependsOn buildResistanceQuery }
